[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscalop"
version = "0.1.0"
description = "Single-cell analysis operations — Python port of scalop"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Julie Laffy", email = "laffy.julie@gmail.com" }]
keywords = ["single-cell", "RNA-seq", "scRNA-seq", "glioma", "signature-scoring"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "anndata>=0.10",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
scanpy = ["scanpy>=1.10"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/julielaffy/pyscalop"

[tool.setuptools.packages.find]
include = ["pyscalop*"]

[tool.ruff]
line-length = 100
target-version = "py310"
